[workspace]
resolver = "2"

members = [
    "ariadne-core",
    "ariadne-mcp",
    "ariadne-tools",
    "ariadne-cli",
    "ariadne-cypher",
]

[workspace.package]
authors = ["Artavazd Balaian <reasyu@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.94.1"
version = "0.8.2"

[workspace.dependencies]
ariadne-mcp = { path = "ariadne-mcp" }
ariadne-core = { path = "ariadne-core" }
ariadne-cypher = { path = "ariadne-cypher" }
ariadne-tools = { path = "ariadne-tools" }
async-trait = "0.1"
axum = "0.8.9"
axum-prometheus = "0.10"
chrono = { version = "0.4" }
clap = {  version = "4.6", features = ["derive", "env"] }
const_format = "0.2"
crossbeam = "0.8"
dioxus = "0.7.6"
dioxus-desktop = "0.7.6"
dioxus-native = "0.7.6"
eframe = "0.34.1"
egui = "0.34.1"
egui_extras = "0.34.1"
futures = {  version = "0.3" }
http = "1"
k8s-openapi = { version = "0.27.1", features = ["v1_32", "schemars"] }
kube = { version = "3.1.0", features = ["runtime"] }
llm = { version = "1.3.8", features = ["openai", "anthropic", "ollama", "deepseek", "xai", "google", "groq"]}
metrics = "0.24"
petgraph = { version = "0.8.3", features = ["serde-1"] }
reqwest = { version = "0.13", features = ["json", "rustls-tls"] }
rmcp = { version = "1.5.0", features = ["server", "transport-streamable-http-server", "macros", "transport-worker"] }
rsmgclient = { version = "3.0.0" }
rustls = "0.23"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
shadow-rs = "1.7.1"
strum = "0.28"
strum_macros = "0.28"
testcontainers = { version = "0.27", features = ["watchdog", "blocking"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1.2"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-br", "propagate-header", "sensitive-headers", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-cypher = { git="https://github.com/taekwombo/tree-sitter-cypher.git", rev = "fd6c44af569431e51f251a15e2ebb2efb11ff983" }

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
debug = true

[workspace.lints.clippy]
# Detects large stack-allocated futures that may cause stack overflow crashes (see threshold in clippy.toml)
large_futures = "warn"
used_underscore_binding = "warn"
or_fun_call = "warn"
unnecessary_lazy_evaluations = "warn"
uninlined_format_args = "warn"
