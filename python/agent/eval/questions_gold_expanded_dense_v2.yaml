      - 0.0
      - 163904.0
    - - tempo
      - 245648.0
      - 163636.0
    - - upwind
      - 101440.0
      - 14240.0
    ordered: false
  deterministic: true
  reference_cypher: "MATCH (p:Pod)-[:BelongsTo]->(ns:Namespace)\nUNWIND p['spec']['containers']\
    \ AS container\nWITH ns, container['resources']['requests'] AS reqs, container['resources']['limits']\
    \ AS lims\nWITH ns,\n  CASE\n    WHEN reqs['memory'] IS NULL THEN 0.0\n    WHEN\
    \ reqs['memory'] ENDS WITH 'Ti' THEN toFloat(replace(reqs['memory'], 'Ti', ''))\
    \ * 1024 * 1024\n    WHEN reqs['memory'] ENDS WITH 'Gi' THEN toFloat(replace(reqs['memory'],\
    \ 'Gi', '')) * 1024\n    WHEN reqs['memory'] ENDS WITH 'Mi' THEN toFloat(replace(reqs['memory'],\
    \ 'Mi', ''))\n    WHEN reqs['memory'] ENDS WITH 'Ki' THEN toFloat(replace(reqs['memory'],\
    \ 'Ki', '')) / 1024\n    WHEN reqs['memory'] ENDS WITH 'T' THEN toFloat(replace(reqs['memory'],\
    \ 'T', '')) * 1000000000000 / 1048576\n    WHEN reqs['memory'] ENDS WITH 'G' THEN\
    \ toFloat(replace(reqs['memory'], 'G', '')) * 1000000000 / 1048576\n    WHEN reqs['memory']\
    \ ENDS WITH 'M' THEN toFloat(replace(reqs['memory'], 'M', '')) * 1000000 / 1048576\n\
    \    WHEN reqs['memory'] ENDS WITH 'k' THEN toFloat(replace(reqs['memory'], 'k',\
    \ '')) * 1000 / 1048576\n    ELSE toFloat(reqs['memory']) / 1048576\n  END AS\
    \ req_memory_mib,\n  CASE\n    WHEN lims['memory'] IS NULL THEN 0.0\n    WHEN\
    \ lims['memory'] ENDS WITH 'Ti' THEN toFloat(replace(lims['memory'], 'Ti', ''))\
    \ * 1024 * 1024\n    WHEN lims['memory'] ENDS WITH 'Gi' THEN toFloat(replace(lims['memory'],\
    \ 'Gi', '')) * 1024\n    WHEN lims['memory'] ENDS WITH 'Mi' THEN toFloat(replace(lims['memory'],\
    \ 'Mi', ''))\n    WHEN lims['memory'] ENDS WITH 'Ki' THEN toFloat(replace(lims['memory'],\
    \ 'Ki', '')) / 1024\n    WHEN lims['memory'] ENDS WITH 'T' THEN toFloat(replace(lims['memory'],\
    \ 'T', '')) * 1000000000000 / 1048576\n    WHEN lims['memory'] ENDS WITH 'G' THEN\
    \ toFloat(replace(lims['memory'], 'G', '')) * 1000000000 / 1048576\n    WHEN lims['memory']\
    \ ENDS WITH 'M' THEN toFloat(replace(lims['memory'], 'M', '')) * 1000000 / 1048576\n\
    \    WHEN lims['memory'] ENDS WITH 'k' THEN toFloat(replace(lims['memory'], 'k',\
    \ '')) * 1000 / 1048576\n    ELSE toFloat(lims['memory']) / 1048576\n  END AS\
    \ lim_memory_mib\nRETURN ns['metadata']['name'] AS namespace,\n       sum(req_memory_mib)\
    \ AS total_requested_memory_mib,\n       sum(lim_memory_mib) AS total_limit_memory_mib\n\
    ORDER BY namespace"
  parameters: {}
