medium:
- id: m01
  question: For namespace litmus, list deployments and the replica sets they manage.
  tags:
  - deployment
  - replicaset
  - namespace
  - join
  deterministic: true
  reference_cypher: 'MATCH (ns:Namespace)

    WHERE ns[''metadata''][''name''] = ''litmus''

    MATCH (d:Deployment)-[:BelongsTo]->(ns)

    MATCH (d)-[:Manages]->(rs:ReplicaSet)

    RETURN d[''metadata''][''name''] AS deployment, rs[''metadata''][''name''] AS
    replica_set

    ORDER BY deployment, replica_set'
  expected:
    columns:
    - deployment
    - replica_set
    rows:
    - - chaos-litmus-auth-server
      - chaos-litmus-auth-server-6b79d4d5bd
    - - chaos-litmus-frontend
      - chaos-litmus-frontend-86ccb7c787
    - - chaos-litmus-server
      - chaos-litmus-server-68bf554745
    ordered: false
- id: m02
  question: For namespace litmus, list replica sets and the pods they manage.
  tags:
  - replicaset
  - pod
  - namespace
  - join
  deterministic: true
  reference_cypher: 'MATCH (rs:ReplicaSet)-[:BelongsTo]->(ns:Namespace)

    WHERE ns[''metadata''][''name''] = ''litmus''

    MATCH (rs)-[:Manages]->(p:Pod)

    RETURN rs[''metadata''][''name''] AS replicaset, collect(DISTINCT p[''metadata''][''name''])
    AS pods

    ORDER BY replicaset'
  expected:
    columns:
    - pods
    - replicaset
    rows:
    - - - chaos-litmus-auth-server-6b79d4d5bd-hpjfz
      - chaos-litmus-auth-server-6b79d4d5bd
    - - - chaos-litmus-frontend-86ccb7c787-m8m85
      - chaos-litmus-frontend-86ccb7c787
    - - - chaos-litmus-server-68bf554745-zbr95
      - chaos-litmus-server-68bf554745
    ordered: false
- id: m03
  question: For namespace litmus, list daemon sets and the pods they manage.
  tags:
  - daemonset
  - pod
  - namespace
  - join
  deterministic: true
  reference_cypher: 'MATCH (ds:DaemonSet)-[:BelongsTo]->(ns:Namespace)

    WHERE ns[''metadata''][''name''] = ''litmus''

    MATCH (ds)-[:Manages]->(p:Pod)

    RETURN ds[''metadata''][''name''] AS daemon_set, p[''metadata''][''name''] AS
    pod

    ORDER BY daemon_set, pod'
  expected:
    columns: []
    rows: []
    ordered: false
