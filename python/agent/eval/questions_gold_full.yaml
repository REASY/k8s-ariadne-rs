- id: m07
  question: For namespace litmus, list services and the pods backing each service.
  tags:
  - service
  - endpointslice
  - endpoint
  - pod
  - namespace
  - join
  deterministic: true
  reference_cypher: 'MATCH (ns:Namespace)<-[:BelongsTo]-(s:Service)

    WHERE ns[''metadata''][''name''] = ''litmus''

    OPTIONAL MATCH (s)-[:Manages]->(:EndpointSlice)-[:ContainsEndpoint]->(:Endpoint)-[:HasAddress]->(:EndpointAddress)-[:IsAddressOf]->(p:Pod)

    WITH s, collect(DISTINCT p[''metadata''][''name'']) AS backing_pods

    RETURN s[''metadata''][''name''] AS service, backing_pods

    ORDER BY service'
  expected:
    columns:
    - backing_pods
    - service
    rows:
    - - - chaos-litmus-auth-server-6b79d4d5bd-hpjfz
      - chaos-litmus-auth-server-service
    - - - chaos-litmus-frontend-86ccb7c787-m8m85
      - chaos-litmus-frontend-service
    - - - chaos-litmus-server-68bf554745-zbr95
      - chaos-litmus-server-service
    - - - chaos-mongodb-arbiter-0
      - chaos-mongodb-arbiter-headless
    - - - chaos-mongodb-1
        - chaos-mongodb-2
        - chaos-mongodb-0
      - chaos-mongodb-headless
    ordered: false
