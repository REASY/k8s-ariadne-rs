medium:
- id: m04
  question: For namespace litmus, list stateful sets and the pods they manage.
  tags:
  - statefulset
  - pod
  - namespace
  - join
  deterministic: true
  reference_cypher: "MATCH (ss:StatefulSet)-[:BelongsTo]->(ns:Namespace)\nWHERE ns['metadata']['name']\
    \ = 'litmus'\nOPTIONAL MATCH (ss)-[:Manages]->(p:Pod)-[:BelongsTo]->(ns)\nWITH\
    \ ss, ns, collect(DISTINCT p) AS pods\nRETURN \n  ns['metadata']['name'] AS namespace,\n\
    \  ss['metadata']['name'] AS statefulset,\n  [p IN pods | p['metadata']['name']]\
    \ AS pod_names,\n  size(pods) AS pod_count\nORDER BY statefulset ASC;"
  expected:
    columns:
    - namespace
    - pod_count
    - pod_names
    - statefulset
    rows:
    - - litmus
      - 3
      - - chaos-mongodb-2
        - chaos-mongodb-1
        - chaos-mongodb-0
      - chaos-mongodb
    - - litmus
      - 1
      - - chaos-mongodb-arbiter-0
      - chaos-mongodb-arbiter
    ordered: false
