- id: h08
  question: List deployments where ready replicas are fewer than desired replicas.
  tags:
  - deployment
  - status
  - filter
  deterministic: true
  reference_cypher: "MATCH (d:Deployment)\nWITH d,\n  coalesce(d['spec']['replicas'],\
    \ 0) AS desired,\n  coalesce(d['status']['readyReplicas'], 0) AS ready\nWHERE\
    \ ready < desired\nRETURN\n  d['metadata']['namespace'] AS namespace,\n  d['metadata']['name']\
    \ AS deployment,\n  desired AS desired_replicas,\n  ready AS ready_replicas,\n\
    \  (desired - ready) AS missing_ready_replicas\nORDER BY missing_ready_replicas\
    \ DESC, namespace ASC, deployment ASC"
  expected:
    columns: []
    rows: []
    ordered: false
- id: h09
  question: List pods in namespace storefront that are not managed by any Deployment,
    StatefulSet, DaemonSet, Job, or ReplicaSet.
  tags:
  - pod
  - namespace
  - negative
  deterministic: true
  reference_cypher: "MATCH (ns:Namespace)\nWHERE ns['metadata']['name'] = 'storefront'\n\
    MATCH (p:Pod)-[:BelongsTo]->(ns)\nOPTIONAL MATCH (rs:ReplicaSet)-[:Manages]->(p)\n\
    OPTIONAL MATCH (dep:Deployment)-[:Manages]->(rs)\nOPTIONAL MATCH (ss:StatefulSet)-[:Manages]->(p)\n\
    OPTIONAL MATCH (ds:DaemonSet)-[:Manages]->(p)\nOPTIONAL MATCH (j:Job)-[:Manages]->(p)\n\
    WITH p,\n  collect(DISTINCT rs) AS rss,\n  collect(DISTINCT dep) AS deps,\n  collect(DISTINCT\
    \ ss) AS sss,\n  collect(DISTINCT ds) AS dss,\n  collect(DISTINCT j) AS js\nWHERE\
    \ size(rss) = 0 AND size(deps) = 0 AND size(sss) = 0 AND size(dss) = 0 AND size(js)\
    \ = 0\nRETURN p['metadata']['name'] AS pod,\n       p['metadata']['namespace']\
    \ AS namespace,\n       p['status']['phase'] AS phase\nORDER BY pod"
  expected:
    columns:
    - namespace
    - phase
    - pod
    rows:
    - - storefront
      - Running
      - dxu3
    ordered: false
- id: h12
  question: For each ingress in namespace litmus, list backend services that have
    no endpoint slices.
  tags:
  - ingress
  - service
  - endpointslice
  - namespace
  - negative
