    MATCH (s:Service)-[:BelongsTo]->(ns)\nOPTIONAL MATCH (s)-[:Manages]->(es:EndpointSlice)\n\
    WITH s, count(DISTINCT es) AS endpoint_slices\nWHERE endpoint_slices = 0\nRETURN\
