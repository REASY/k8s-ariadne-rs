[package]
name = "ariadne-mcp"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[dependencies]
ariadne-core = { workspace = true }
ariadne-tools = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-prometheus = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
k8s-openapi = { workspace = true }
kube = { workspace = true }
metrics = { workspace = true }
rmcp = { workspace = true }
rsmgclient = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
shadow-rs = { workspace = true, optional = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
tower-http = { workspace = true, features = ["trace", "compression-br", "propagate-header", "sensitive-headers", "cors", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
shadow-rs = { workspace = true, optional = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

[features]
default = []
build-info = ["dep:shadow-rs"]
